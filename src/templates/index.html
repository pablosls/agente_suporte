<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - Geladeira RAG</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 2s infinite;
        }

        .clear-btn {
            position: absolute;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message p {
            margin-bottom: 8px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #334155;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .timing-info {
            display: block;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 6px;
            text-align: right;
            font-style: italic;
        }

        .thinking {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            align-items: center;
            background: #334155;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            opacity: 0.7;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        #input-area {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 0 25px;
            border-radius: 30px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="chat-container">
        <header style="position: relative;">
            <div class="status-dot"></div>
            Assistente Técnico RAG
            <button class="clear-btn" id="clearBtn">Novo Chat</button>
        </header>

        <div id="messages">
            <div class="message assistant">Ola! Sou o assistente de manuais. Como posso te apoiar com sua geladeira
                hoje?</div>
        </div>

        <div class="thinking hidden" id="typing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="Insira a sua dúvida aqui..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('refrigerator_session_id') || null;
        const messagesDiv = document.getElementById('messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const socket = io({ transports: ["websocket", "polling"] });

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        if (!sessionId) {
            sessionId = generateUUID();
            localStorage.setItem('refrigerator_session_id', sessionId);
        }

        // Join room for this session
        socket.emit('join', { session_id: sessionId });
        fetchMessages();

        // Listen for real-time updates
        socket.on('new_message', (data) => {
            console.log("WebSocket: New message notification received for session", data.session_id);
            if (data.session_id === sessionId) {
                fetchMessages();
            }
        });

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function createMessageElement(text, sender, responseTime = null, ragIds = null, ragScores = null, tokenCount = null) {
            const el = document.createElement('div');
            el.className = `message ${sender}`;
            
            const textSpan = document.createElement('span');
            textSpan.innerText = text;
            el.appendChild(textSpan);

            if (sender === 'assistant') {
                const footerEl = document.createElement('div');
                footerEl.className = 'timing-info';
                
                let footerText = '';
                if (responseTime) footerText += `⚡ ${responseTime}s`;
                if (tokenCount) footerText += (footerText ? ' | ' : '') + `🪙 ${tokenCount} tokens`;
                
                if (ragIds) {
                    const ids = ragIds.split(', ');
                    const scores = ragScores ? ragScores.split(', ') : [];
                    const docsInfo = ids.map((id, index) => {
                        const score = scores[index] ? ` (${scores[index]})` : '';
                        return id.split('/').pop() + score;
                    }).join(', ');
                    
                    footerText += (footerText ? ' | ' : '') + `Sources: ${docsInfo}`;
                }
                
                if (footerText) {
                    footerEl.innerText = footerText;
                    el.appendChild(footerEl);
                }
            }

            messagesDiv.appendChild(el);
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            // Append message locally for immediate feedback
            createMessageElement(text, 'user');

            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            try {
                await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: text, session_id: sessionId })
                });
            } catch (err) {
                console.error("Send Error:", err);
                typingIndicator.classList.add('hidden');
            }
        }

        async function fetchMessages() {
            try {
                const res = await fetch(`/getMessages?session_id=${sessionId}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.length > 0) {
                        // Rebuild chat history
                        messagesDiv.innerHTML = '<div class="message assistant">Ola! Sou o assistente de manuais. Como posso te apoiar com sua geladeira hoje?</div>';
                        data.forEach(m => {
                            createMessageElement(m.text, m.sender, m.response_time, m.rag_ids, m.rag_scores, m.token_count);
                        });
                        
                        // hide typing if the last message is from assistant
                        if (data[data.length - 1].sender === 'assistant') {
                            typingIndicator.classList.add('hidden');
                        } else {
                            typingIndicator.classList.remove('hidden');
                        }
                        scrollToBottom();
                    }
                }
            } catch (e) { 
                console.error("Fetch Error: ", e); 
            }
        }

        function clearChat() {
            if (confirm("Tem certeza que deseja iniciar um novo chat? O histórico atual será perdido nesta tela.")) {
                localStorage.removeItem('refrigerator_session_id');
                sessionId = generateUUID();
                localStorage.setItem('refrigerator_session_id', sessionId);
                
                // Clear UI
                messagesDiv.innerHTML = '<div class="message assistant">Ola! Sou o assistente de manuais. Como posso te apoiar com sua geladeira hoje?</div>';
                typingIndicator.classList.add('hidden');
                
                // Join new room
                socket.emit('join', { session_id: sessionId });
                console.log("Chat cleared. New session started:", sessionId);
            }
        }

        document.getElementById('clearBtn').addEventListener('click', clearChat);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

</html>
